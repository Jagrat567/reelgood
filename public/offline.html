<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#e50914" />
    <title>Reelgood — Offline</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; background: #000; color: #fff; }
      body { display: grid; place-items: center; padding: 24px; font-family: Arial, Helvetica, sans-serif; }
      main { width: min(100%, 440px); text-align: center; }
      .logo { display: inline-grid; width: 64px; height: 64px; place-items: center; border-radius: 14px; background: #e50914; box-shadow: 0 18px 48px rgba(229,9,20,.28); }
      .logo::after { content: ''; margin-left: 5px; border-top: 12px solid transparent; border-bottom: 12px solid transparent; border-left: 19px solid #fff; }
      h1 { margin: 28px 0 10px; font-size: clamp(30px, 8vw, 44px); letter-spacing: -.04em; }
      p { margin: 0 auto; max-width: 36ch; color: rgba(255,255,255,.64); font-size: 16px; line-height: 1.6; }
      button { margin-top: 26px; min-height: 48px; border: 0; border-radius: 999px; padding: 0 24px; background: #e50914; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <span class="logo" aria-hidden="true"></span>
      <h1>You’re offline</h1>
      <p>Reconnect to refresh recommendations. Movies and series you loaded earlier may still be available from the app’s offline cache.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
